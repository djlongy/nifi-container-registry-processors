---
# A tag v<version> builds the NAR and publishes it, with its .sha256, as a GitHub release.
# The tag must match the version in pom.xml.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test
        run: |
          version=$(mvn -q -B -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pom version $version" >&2
            exit 1
          fi
          mvn -B -ntp package
          cd nifi-container-registry-nar/target
          sha256sum "nifi-container-registry-nar-$version.nar" > "nifi-container-registry-nar-$version.nar.sha256"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "nifi-container-registry-processors ${GITHUB_REF_NAME#v}" \
            --notes "NiFi 2.x NAR with PushContainerImages and PullContainerImages. Copy the .nar into each node's extensions directory; check it with sha256sum -c." \
            nifi-container-registry-nar/target/*.nar nifi-container-registry-nar/target/*.nar.sha256
