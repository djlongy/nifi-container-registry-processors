---
stages: [test, scan]

include:
  - project: 'infra/gitlab-ci-templates'
    ref: '1.7.1'
    file: '/templates/quality-sonarqube/template.yml'
    inputs:
      instance: nifi-registry-processors
      stage: scan
      sarif-report-jobs: [{ job: 'python-test', artifacts: true }]
      sources: 'python/container_registry'
      exclusions: '.ci-tpl/**,.ci-artifacts/**'
      extra-properties: 'sonar.tests=python/tests;sonar.python.version=3.12;sonar.python.coverage.reportPaths=coverage.xml'

python-test:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  # A Python 3.12 image from the runner's allowed registry, set as a project CI variable.
  image: $PYTHON_TEST_IMAGE
  script:
    - pip install --no-cache-dir coverage
    - coverage run --source=python/container_registry -m unittest discover -s python/tests
    - coverage xml -o coverage.xml
    - coverage report
  coverage: '/^TOTAL.*\s(\d+(?:\.\d+)?)%$/'
  artifacts:
    paths: [coverage.xml]
    expire_in: 7 days
